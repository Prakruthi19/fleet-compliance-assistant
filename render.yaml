# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Secrets marked sync: false are asked for once in the dashboard.
services:
  - type: web
    name: federal-rules-guide
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_REASONING_EFFORT
        value: none
      - key: ASK_LIMIT_PER_HOUR
        value: "20"
