# Local infrastructure for regrag. Start with: docker compose up -d
# then set QDRANT_URL=http://localhost:6333 in .env (otherwise regrag uses
# embedded Qdrant on disk, which is fine for a few titles but brute-force).
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"   # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Semantic/answer cache for the API layer (next phase).
  redis:
    image: redis:8.8.2-alpine
    ports:
      - "6380:6379"   # 6379 is taken by another project on this machine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # API + UI. Opt-in so `docker compose up -d` still starts only the infra:
  #   docker compose --profile app up -d --build
  # Ollama keeps running on the host (it needs direct access to RAM/CPU).
  api:
    profiles: ["app"]
    build: .
    ports:
      - "8000:8000"
    env_file: .env              # LLM_PROVIDER / LLM_API_KEY etc.
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
      REGRAG_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data        # ingest state + catalog + feedback
      - model_cache:/models     # fastembed/reranker weights
    depends_on: [qdrant, redis]
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  model_cache:
